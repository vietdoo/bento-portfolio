<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Code that survives millions of requests</title>
  <desc id="description">Five engineering principles arranged as a production request pipeline.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0b1220" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)" />
  <path d="M0 330 H1200" stroke="#38bdf8" stroke-opacity=".12" />
  <path d="M0 510 H1200" stroke="#38bdf8" stroke-opacity=".12" />
  <text x="80" y="105" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="22" font-weight="700">PRODUCTION PLAYBOOK / 05</text>
  <text x="80" y="168" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="50" font-weight="700">CODE THAT SURVIVES</text>
  <text x="80" y="225" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="50" font-weight="700">MILLIONS OF REQUESTS</text>
  <text x="80" y="268" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="22">5 engineering principles from production</text>
  <path d="M145 435 H1055" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <g fill="#0b1220" stroke="#a5f3fc" stroke-width="2" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="80" y="390" width="130" height="90" rx="14" />
    <text x="145" y="443" fill="#e2e8f0">SIMPLE</text>
    <rect x="255" y="390" width="130" height="90" rx="14" />
    <text x="320" y="443" fill="#e2e8f0">DESIGN</text>
    <rect x="430" y="390" width="130" height="90" rx="14" />
    <text x="495" y="443" fill="#e2e8f0">MEASURE</text>
    <rect x="605" y="390" width="130" height="90" rx="14" />
    <text x="670" y="443" fill="#e2e8f0">AUTOMATE</text>
    <rect x="780" y="390" width="130" height="90" rx="14" />
    <text x="845" y="443" fill="#e2e8f0">CLEAN</text>
  </g>
  <circle cx="1055" cy="435" r="12" fill="#38bdf8" />
  <text x="1055" y="535" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">REQUEST FLOW</text>
</svg>
